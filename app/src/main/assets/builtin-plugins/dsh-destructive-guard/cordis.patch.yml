# 完全权限使用全盘访问 + never，强制工具策略据当前会话放行。
# 保留 guarded-full-access，已有明确要求确认的会话继续可用。
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "process.env.DSH_PERMISSION_MODE === 'danger-full-access' ? 'never' : 'ask'"
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    defaultPreset: !!js "((process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'read-only') ? 'read-only' : (((process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access') ? 'danger-full-access' : 'workspace-write')"
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        name: read-only
        description: Read-only; actions that need approval still ask.
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: workspace-write
        description: Write inside the workspace and permitted temp directories; wider retries require approval.
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: danger-full-access
        description: Full file access without approval prompts, including destructive commands and existing-file overwrites.
      guarded-full-access:
        sandbox: danger-full-access
        approval: ask
        name: guarded-full-access
        description: Full file access; destructive or opaque agent commands and existing-file overwrites ask once.
- insert:
  - id: destructive-guard
    name: 'dsh-destructive-guard'
