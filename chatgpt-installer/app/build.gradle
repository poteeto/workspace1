plugins {
    id 'com.android.application'
}
android {
    namespace 'dev.chatgpt.splitinstaller'
    compileSdk 35
    defaultConfig {
        // v1 used a disposable build signing key. Give v2 a distinct app id to
        // avoid a signature conflict with an already-installed v1 wrapper.
        applicationId 'dev.chatgpt.splitinstaller.v2'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
