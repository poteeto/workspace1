name: Android unit tests for DSH rc2
on:
  push:
    branches: ['upgrade/dsh-0.2.1-rc.2']
    paths:
      - .github/workflows/check-upgrade-android.yml
      - app/build.gradle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Resolve toolchain from DSHA source
        id: toolchain
        run: python3 tools/ci-toolchain.py --github-output
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
      - uses: android-actions/setup-android@v3
      - name: Install required Android SDK tools
        shell: bash
        run: |
          platform=$(python3 tools/ci-toolchain.py --field androidPlatform)
          buildtools=$(python3 tools/ci-toolchain.py --field buildTools)
          sdkmanager "platforms;$platform" "build-tools;$buildtools"
      - name: Compile and test both Android variants without offline release assets
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:testStandardDebugUnitTest :app:testLowDebugUnitTest \
            -x :app:prepareStandardAssets -x :app:prepareRecoveryAssets \
            --no-daemon --max-workers=2
