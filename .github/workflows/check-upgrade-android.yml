name: Android unit tests for DSH rc2
on:
  push:
    branches: ['upgrade/dsh-0.2.1-rc.2']
    paths:
      - .github/workflows/check-upgrade-android.yml
      - app/build.gradle
      - gradle/verification-metadata.xml
      - app/src/main/java/com/deepseekharness/app/util/AdbWheelPaths.java
      - app/src/test/java/com/deepseekharness/app/util/AdbWheelPathsTest.java
      - app/src/test/java/com/deepseekharness/app/util/ManagedPatchRegistryIntegrationTest.java
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Resolve toolchain from DSHA source
        id: toolchain
        run: python3 tools/ci-toolchain.py --github-output
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install required Android SDK tools
        shell: bash
        run: |
          platform=$(python3 tools/ci-toolchain.py --field androidPlatform)
          buildtools=$(python3 tools/ci-toolchain.py --field buildTools)
          sdkmanager "platforms;$platform" "build-tools;$buildtools"
      - name: Rebuild verified bxroot ARM64 native inputs
        run: |
          ndk=$(python3 tools/ci-toolchain.py --field ndk)
          sdkmanager "ndk;$ndk"
          python3 tools/bxroot/build.py --help
      - name: Compile and test both Android variants without offline release assets
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:testStandardDebugUnitTest :app:testLowDebugUnitTest \
            -x :app:prepareStandardAssets -x :app:prepareRecoveryAssets \
            -x :app:verifyBxrootNative -x :app:verifyBxrootProjection \
            --no-daemon --max-workers=2
      - name: Display test failures with XML assertions
        if: failure()
        shell: bash
        run: |
          find app/build/test-results -name 'TEST-*.xml' -type f -print0 |
            xargs -0 -r grep -n -A30 -B3 '<failure' | head -180 || true
