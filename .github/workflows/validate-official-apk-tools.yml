name: Validate fixed DSHA publishing signature gates
on:
  push:
    branches: ['upgrade/dsh-0.2.1-rc.2']
    paths:
      - .github/workflows/validate-official-apk-tools.yml
      - tools/build-official-apks.sh
      - tools/ci-github-sign-release.sh
      - tools/github-signing-state.py
      - tools/test-github-signing-state.py
      - tools/verify-official-apk.py
      - tools/test-verify-official-apk.py
      - ci/release-identity.json
      - app/build.gradle
  workflow_dispatch:
permissions: {contents: read}
jobs:
  release-tool-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check release shell and Python syntax
        run: |
          bash -n tools/build-official-apks.sh tools/ci-github-sign-release.sh
          python3 -m py_compile tools/verify-official-apk.py tools/test-verify-official-apk.py
      - name: Prove missing escrow never rotates the fixed signing key
        run: python3 tools/test-github-signing-state.py -v
      - name: Prove release identity, signer, version and debuggable failures are rejected
        run: python3 tools/test-verify-official-apk.py -v
      - name: Assert repository contains only reference fingerprints, not a publishing keystore
        run: |
          test -f ci/release-identity.json
          test ! -f DSHA-ACTUAL-PUBLISH-KEY-debug.keystore
          test ! -f app/DSHA-ACTUAL-PUBLISH-KEY-debug.keystore
          test ! -f DSHA-KEEP-PRIVATE-PUBLISH-KEY-v1.p12
          test ! -f app/DSHA-KEEP-PRIVATE-PUBLISH-KEY-v1.p12
