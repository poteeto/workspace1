name: Build ChatGPT split installer

on:
  push:
    branches:
      - chatgpt-singlefile-installer
    paths:
      - 'chatgpt-installer/**'
      - '.github/workflows/build-chatgpt-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          yes | "$SDKMANAGER" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: chatgpt-installer
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload generic installer APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-original-signature-installer
          path: chatgpt-installer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
