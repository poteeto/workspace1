name: Import DSHA upstream source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-dsha.yml

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'poteeto/workspace1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge pinned DSHA upstream without overwriting existing project controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add dsha-upstream https://github.com/DSH-APP/DSHA.git
          git fetch --no-tags dsha-upstream main
          upstream=891405e006da2316ff593cb4a74485de6c1d7b19
          git cat-file -e "${upstream}^{commit}"
          if git merge-base --is-ancestor "$upstream" HEAD; then
            echo "Pinned upstream is already in history"
            exit 0
          fi
          git merge --allow-unrelated-histories --no-ff -s ours \
            -m "Track DSHA upstream commit $upstream" "$upstream"
          git checkout "$upstream" -- .
          git commit -m "Import DSHA source snapshot ($upstream)"
          git push origin HEAD:main
