name: DSH runtime host compatibility audit
on:
  push:
    branches: ['upgrade/dsh-0.2.1-rc.2']
    paths:
      - .github/workflows/audit-runtime-host.yml
      - tools/audit-runtime-postinstall.py
      - tools/verify-runtime-installation.py
      - app/src/main/java/com/deepseekharness/app/util/LanSettingsCompatibility.java
      - app/src/main/java/com/deepseekharness/app/runtime/RuntimeTools.java
      - app/src/main/assets/runtime-patches.json
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install exact DSH linux-arm64 package graph
        working-directory: tools/dsh-runtime
        run: npm ci --os=linux --cpu=arm64 --libc=glibc --ignore-scripts --no-audit --no-fund
      - name: Generate host-managed runtime files exactly as APK build does
        run: |
          python3 tools/pc-migration/prepare-assets.py --output app/src/main/assets
          python3 tools/prepare-backup-assets.py --write
          python3 tools/generate-third-party-notices.py
      - name: Exercise every installer patch against the exact published modules
        run: python3 tools/verify-runtime-installation.py
      - name: Inspect settings source if a reviewed migration contract changes
        if: failure()
        run: python3 tools/audit-runtime-postinstall.py
