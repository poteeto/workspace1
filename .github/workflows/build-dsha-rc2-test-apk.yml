name: Build isolated DSHA rc2 Android test APK
on:
  push:
    branches: ['upgrade/dsh-0.2.1-rc.2']
    paths: [.github/workflows/build-dsha-rc2-test-apk.yml, app/build.gradle, app/src/main/res/**, app/src/main/java/com/deepseekharness/app/ui/**, app/src/main/java/com/deepseekharness/app/util/Constants.java, app/src/main/java/com/deepseekharness/app/util/AdbWheelPaths.java, app/src/main/java/com/deepseekharness/app/runtime/RuntimeTools.java, app/src/main/assets/runtime-patches.json, tools/report-apk-size.py, tools/verify-monochrome-ui.py, tools/ci-restore-upstream-base.py, tools/recovery_runtime_overlay.py, tools/prepare-recovery-assets.py, tools/recovery-runtime/legacy-patches/**]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install pinned Java 17, Android SDK, and gcc-arm64
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare source-pinned toolchains
        shell: bash
        run: |
          set -euo pipefail
          platform=$(python3 tools/ci-toolchain.py --field androidPlatform)
          buildtools=$(python3 tools/ci-toolchain.py --field buildTools)
          ndk=$(python3 tools/ci-toolchain.py --field ndk)
          sdkmanager "platforms;$platform" "build-tools;$buildtools" "ndk;$ndk"
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-13-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Restore immutable baseline Ubuntu assets from checksum-verified official APK
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/DSH-APP/DSHA/releases/download/v0.2.0-rc2/dsha-0.2.0-rc2.apk'
          curl -fLsS --retry 2 "$url" -o "$RUNNER_TEMP/upstream-rc2.apk"
          python3 tools/ci-restore-upstream-base.py "$RUNNER_TEMP/upstream-rc2.apk"
      - name: Rebuild source-locked native bxroot executables
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/bxroot/build.py --prepare-source "$RUNNER_TEMP/bxroot-src"
          (cd "$RUNNER_TEMP/bxroot-src" && BXROOT_OUTPUT="$RUNNER_TEMP/bxroot-bin" sh "$GITHUB_WORKSPACE/tools/bxroot/build-linux.sh")
          cp "$RUNNER_TEMP/bxroot-bin/"libbxroot*.so app/src/main/jniLibs/arm64-v8a/
          python3 -B tools/bxroot/build.py --check
      - name: Install upgraded DSH dependencies for real target Linux ARM64
        shell: bash
        working-directory: tools/dsh-runtime
        run: npm ci --os=linux --cpu=arm64 --libc=glibc --ignore-scripts --no-audit --no-fund
      - name: Materialize DSH 0.2.1-rc.2 immutable offline runtime
        run: |
          python3 tools/audit-dsh-patches.py
          python3 tools/audit-dsh-pdf.py
          python3 tools/build-dsh-runtime.py \
            --source tools/dsh-runtime/node_modules \
            --output app/src/main/assets/dsh-runtime.bin
      - name: Refresh provenance for target-specific packages without weakening policy
        run: |
          python3 tools/pc-migration/prepare-assets.py --output app/src/main/assets
          python3 tools/prepare-backup-assets.py --write
          python3 tools/generate-third-party-notices.py
          python3 tools/prepare-runtime-descriptor.py --write
          python3 tools/prepare-runtime-descriptor.py --check
      - name: Enforce Android and DSH patch registry version alignment
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          target = json.loads(Path("tools/dsh-runtime/package.json").read_text())["dependencies"]["@deepseek-ai/dsh"]
          registry = json.loads(Path("app/src/main/assets/runtime-patches.json").read_text())
          source = Path("app/src/main/java/com/deepseekharness/app/util/Constants.java").read_text()
          found = re.search(r'DSH_VERSION\s*=\s*"([^"]+)"', source)
          if not found or found.group(1) != target or registry["dshVersion"] != target:
              raise SystemExit("ANDROID_DSH_REGISTRY_VERSION_MISMATCH: " + repr((found.group(1) if found else None, registry["dshVersion"], target)))
          for entry in registry["active"]:
              name = entry["asset"]
              spec = json.loads((Path("app/src/main/assets") / name).read_text())
              if spec.get("dshVersion") != target:
                  raise SystemExit("ACTIVE_PATCH_VERSION_MISMATCH: " + name)
          print("ANDROID_PATCH_REGISTRY_VERSION_OK", target)
          PY
      - name: Check unified light/dark monochrome native UI and version pins
        run: python3 tools/verify-monochrome-ui.py
      - name: Build fully bundled Standard debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug --no-daemon --max-workers=2
      - name: Verify test APK DSH version and launch assets
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,hashlib,json
          from pathlib import Path
          apks=list(Path('app/build/outputs/apk/standard/debug').glob('*.apk'))
          if len(apks)!=1:raise SystemExit('EXPECTED_ONE_COMPLETE_DEBUG_APK')
          apk=apks[0]
          with zipfile.ZipFile(apk) as z:
            a={i.filename for i in z.infolist()}
            if 'assets/dsh-runtime.bin' not in a or 'assets/offline-rootfs.bin' not in a:
              raise SystemExit('APK_MISSING_OFFLINE_LINUX')
            ver=json.loads(z.read('assets/runtime-descriptor.json'))['dshVersion']
            if ver!='0.2.1-rc.2':raise SystemExit('APK_OLD_DSH_VERSION:'+ver)
            # The user explicitly opted out of the complete older DSH runtime.
            legacy=[p for p in a if p.startswith('assets/recovery-dsh-runtime') or
                    p.startswith('assets/recovery-rootfs') or
                    p.startswith('assets/recovery-runtime.json') or
                    p.startswith('assets/recovery-asset-locations.json') or
                    p.startswith('assets/recovery-overlay/')]
            if legacy: raise SystemExit('APK_UNWANTED_LEGACY_RECOVERY:'+repr(legacy[:10]))
            # Check the ACTUAL packaged assets, not only the checked-in source.
            registry=json.loads(z.read('assets/runtime-patches.json'))
            if registry['dshVersion']!=ver:
              raise SystemExit('APK_PATCH_REGISTRY_VERSION:'+repr((registry['dshVersion'],ver)))
            count=0
            for entry in registry['active']:
              asset='assets/'+entry['asset']
              if asset not in a:raise SystemExit('APK_MISSING_PATCH_RECIPE:'+asset)
              recipe=json.loads(z.read(asset))
              if recipe.get('dshVersion')!=ver:
                raise SystemExit('APK_PATCH_RECIPE_VERSION:'+repr((asset,recipe.get('dshVersion'),ver)))
              count+=1
            if count<20: raise SystemExit('APK_TOO_FEW_ACTIVE_PATCHES:'+str(count))
            print('VALIDATED_EMBEDDED_PATCH_VERSIONS',ver,'recipes',count)
            print('VALIDATED_NO_LEGACY_RECOVERY')
            dex=[zinfo for zinfo in z.infolist() if zinfo.filename.startswith('classes') and zinfo.filename.endswith('.dex')]
            if not dex or any(zinfo.compress_type!=zipfile.ZIP_DEFLATED for zinfo in dex):
              raise SystemExit('APK_DEX_NOT_COMPRESSED')
            print('VALIDATED_DEX_COMPRESSION',len(dex),sum(zinfo.compress_size for zinfo in dex),sum(zinfo.file_size for zinfo in dex))
            print('VALIDATED_DEBUG_APK',apk,apk.stat().st_size,hashlib.sha256(apk.read_bytes()).hexdigest(),'dsh',ver)
          PY
      - name: Measure actual APK size by resource group
        shell: bash
        run: |
          python3 tools/report-apk-size.py \
            app/build/outputs/apk/standard/debug/*.apk \
            --json app/build/outputs/apk/standard/debug/size-breakdown.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DSHA-0.2.1-rc2-APKSIZE-REPORT
          path: app/build/outputs/apk/standard/debug/size-breakdown.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DSHA-0.2.1-rc2-ARM64-SLIM-DEBUG-v174
          path: app/build/outputs/apk/standard/debug/*.apk
          compression-level: 0
          retention-days: 14
